services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: life_duel
      POSTGRES_PASSWORD: life_duel
      POSTGRES_DB: life_duel
    ports:
      - "5432:5432"
    volumes:
      - life_duel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_duel -d life_duel"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4000
      SESSION_SECRET: ${SESSION_SECRET:-cambia-este-secreto-de-desarrollo-32-caracteres}
      PERSISTENCE: postgres
      DATABASE_URL: postgresql://life_duel:life_duel@db:5432/life_duel?schema=public
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node server/dist/index.js"

volumes:
  life_duel_pg:
